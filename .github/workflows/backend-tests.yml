name: PR4482 focused history proofs
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: pr4482-0366a21e-focused-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    name: Exact-source service and repository history proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    steps:
      - name: Checkout proof source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run actual focused tests
        run: |
          set -euo pipefail
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > source-head.txt
          go test -race -timeout=10m -count=1 -json \
            ./internal/task/service ./internal/task/repository/sqlite \
            -run '^(TestDeleteQuickChatConfirmedDeadRuntimeRemovesHistory|TestArchiveQuickChatKeepsAgentHistory|TestDeleteQuickChatRemovesHistoryBeforeResumeTokenRotation|TestDeleteQuickChatFailedStopPreservesLiveHistory|TestDeleteQuickChatAfterExecutorRemovalRemovesHistory|TestQuickChatHistory.*)$' \
            2>&1 | tee focused-history-results.json
      - name: Run exact filesystem regressions
        run: |
          set -euo pipefail
          go test -race -timeout=10m -count=1 -json ./internal/task/service/agenthistory \
            2>&1 | tee focused-filesystem-results.json
      - name: Preserve complete test events and source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4482-0366a21e-focused-history-results
          path: |
            apps/backend/source-head.txt
            apps/backend/focused-history-results.json
            apps/backend/focused-filesystem-results.json
          if-no-files-found: error
          retention-days: 30
