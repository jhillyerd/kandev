name: fork-docker

# Fork-only workflow: build and publish a linux/amd64 container image from
# the current main (which tracks upstream kdlbs/kandev). Mirrors the release
# workflow's build-bundles linux-x64 job and docker-amd64 context staging,
# minus the release machinery (version bump, npm, Homebrew, Scoop, SignPath)
# that needs upstream-only secrets. Uses only stock repository targets, so
# syncing this fork from upstream never conflicts with this file.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Daily, in case main advances through the GitHub "Sync fork" button,
    # which does not always produce a push event this workflow can see.
    - cron: "23 4 * * *"

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-amd64:
    name: Build and push image (amd64, from main)
    # kandev links cgo SQLite, so the binary carries the build host's glibc.
    # ubuntu-22.04 ships glibc 2.35, compatible with the debian:bookworm
    # runtime image (glibc 2.36) - the same pairing the release workflow uses.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0 + upstream dependency refresh
        with:
          go-version-file: apps/backend/go.mod

      - name: Install dependencies
        run: pnpm -C apps install --frozen-lockfile

      # Stock target: builds the web app, embeds it, compiles kandev plus the
      # agentctl helpers, and validates the bundle layout (package-bundle.sh).
      - name: Build runtime bundle
        run: make runtime-bundle

      # Same context layout the release workflow's docker jobs prepare.
      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p ctx/bundle
          cp -R dist/kandev/bin ctx/bundle/bin
          cp docker-entrypoint.sh ctx/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          docker buildx build \
            --file ./Dockerfile \
            --platform linux/amd64 \
            --push \
            --tag "ghcr.io/${{ github.repository_owner }}/kandev:main" \
            --tag "ghcr.io/${{ github.repository_owner }}/kandev:sha-${short_sha}" \
            --provenance=false \
            --sbom=false \
            ./ctx
